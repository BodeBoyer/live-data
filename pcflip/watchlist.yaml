# pcflip watchlist. Each SKU: how to recognize it in listing text, how to price it on eBay,
# and a seed price so the engine works before any live feed is configured.
#
# SEED PRICES ARE ESTIMATES (used, working, eBay sold median, USD) as of 2026-11-09.
# They were set from public price trackers during the Nov 2026 DRAM/NAND shortage and are
# marked confidence: low. Replace them with real data by either:
#   1. `pcflip prices`  (eBay Browse API, needs EBAY_CLIENT_ID/SECRET), or
#   2. filling reference_prices.yaml from Terapeak (eBay Seller Hub -> Research), weekly.
# The resolver always prefers fresher, higher-confidence sources over these seeds.
#
# Pattern notes: text is lowercased, hyphens become spaces, whitespace collapsed before matching.
# RAM and SSD SKUs have no patterns; the extractor derives keys like ddr5-32gb / nvme-2tb itself.

version: 1
updated: "2026-11-09"

defaults:
  gpu:
    ebay_category_id: "27386"          # Computer Components > Graphics/Video Cards
    must_not: ["box only", "empty box", "for parts", "not working", "no video", "laptop", "backplate",
               "bracket", "shroud", "cable", "cooler only", "fan only", "fans", "heatsink", "water block",
               "waterblock", "sticker", "mining rig", "lot of", "bundle of", "read description", "repair"]
  cpu:
    ebay_category_id: "164"            # CPUs/Processors
    must_not: ["for parts", "not working", "bent pins", "delidded", "box only", "cooler only", "lot of", "combo", "motherboard"]
  ram:
    ebay_category_id: "170083"         # Memory (RAM)
    must_not: ["for parts", "not working", "lot of", "mixed", "heatsink only", "ecc", "registered", "rdimm", "server", "laptop", "sodimm", "so-dimm"]
  ssd:
    ebay_category_id: "175669"         # Solid State Drives
    must_not: ["for parts", "not working", "lot of", "enclosure", "heatsink only", "adapter", "case", "bad sectors", "hdd"]

