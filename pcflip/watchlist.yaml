    name: NVIDIA RTX 5090 32GB
    category: gpu
    vram_gb: 32
    patterns: ['(?<!\d)(?:rtx\s*)?5090(?!\d)']
    ebay: { query: "RTX 5090", must: ["5090"], price_range: [2500, 12000] }
    seed: { est_sold: 6500, confidence: low, note: "trackers: $6.2k-7.0k sold median, Nov 2026" }

