[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcflip"
version = "0.1.0"
description = "Find underpriced PC parts and gaming PCs on local marketplaces, value them against live market prices, and alert on flips."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
facebook = ["playwright>=1.45"]
llm = ["anthropic>=0.60"]
dev = ["pytest>=8"]
all = ["playwright>=1.45", "anthropic>=0.60", "pytest>=8"]

[project.scripts]
pcflip = "pcflip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcflip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
